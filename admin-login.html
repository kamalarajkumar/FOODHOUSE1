<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHOUSE Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed, #fed7aa);
        }
        
        .login-box {
            width: 400px;
            max-width: 90%;
            padding: 40px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #f97316;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }
        
        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        
        .login-box input:focus {
            border-color: #f97316;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .error-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">FOODHOUSE</div>

        <div class="subtitle">
            Admin Login
        </div>

        <form id="loginForm">

            <input type="text" id="username" placeholder="Username" required>

            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="errorMessage" class="error-message">
        </div>

    </div>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document
                    .getElementById("username")
                    .value
                    .trim();

                const password =
                    document
                    .getElementById("password")
                    .value;

                const errorMessage =
                    document
                    .getElementById("errorMessage");

                errorMessage.style.display = "none";

                try {

                    const response = await fetch(
                        "https://foodhouse1.onrender.com/api/admin/login", {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.message ||
                            "Invalid username or password"
                        );
                    }

                    sessionStorage.setItem(
                        "foodhouseAdminLoggedIn",
                        "true"
                    );

                    window.location.href =
                        "admin.html";

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    errorMessage.textContent =
                        error.message;

                    errorMessage.style.display =
                        "block";
                }

            });
    </script>

</body>

</html>
