<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHOUSE - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }
        
        .register-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .register-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        
        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #f97316;
        }
        
        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .register-button:hover {
            background: #ea580c;
        }
        
        .register-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            text-align: center;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .login-link a {
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <div class="logo">
                🍽️ FOODHOUSE
            </div>

            <div class="subtitle">
                Create your account
            </div>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" placeholder="Enter your full name" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" placeholder="Enter your phone number">

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" required>

                </div>


                <button type="submit" class="register-button" id="registerButton">
                    Create Account
                </button>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <a href="foodhouse.html" class="back-home">
                ← Back to FOODHOUSE
            </a>

        </div>

    </div>


    <script>
        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerButton =
            document.getElementById("registerButton");


        function showMessage(text, success) {

            message.textContent = text;

            message.style.display = "block";

            message.style.background =
                success ? "#dcfce7" : "#fee2e2";

            message.style.color =
                success ? "#166534" : "#991b1b";
        }


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("name")
                    .value
                    .trim();


                const email =
                    document
                    .getElementById("email")
                    .value
                    .trim();


                const phone =
                    document
                    .getElementById("phone")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("password")
                    .value;


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value;


                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match",
                        false
                    );

                    return;
                }


                registerButton.disabled = true;

                registerButton.textContent =
                    "Creating Account...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/auth/register", {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify({

                                    name: name,

                                    email: email,

                                    phone: phone,

                                    password: password

                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok ||
                        !data.success) {

                        throw new Error(
                            data.message ||
                            "Registration failed"
                        );

                    }


                    showMessage(
                        "Account created successfully!",
                        true
                    );


                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 1000);


                } catch (error) {

                    console.error(
                        "REGISTRATION ERROR:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to create account",
                        false
                    );


                } finally {

                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Create Account";

                }

            }
        );
    </script>

</body>

</html>
