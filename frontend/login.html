<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHOUSE | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --orange: #ff6b00;
            --orange-light: #ff9d00;
            --dark: #0b0b0b;
            --card: rgba(18, 18, 18, 0.94);
            --white: #ffffff;
            --gray: #a8a8a8;
        }
        
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: white;
            overflow-x: hidden;
        }
        /* =========================
           MAIN PAGE
        ========================= */
        
        .login-page {
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
            background: #080808;
        }
        /* =========================
           LEFT FOOD SECTION
        ========================= */
        
        .food-side {
            width: 48%;
            min-height: 100vh;
            position: relative;
            background-image: linear-gradient( 90deg, rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.68)), linear-gradient( 180deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.72)), url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1400&q=90");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 70px;
            overflow: hidden;
        }
        /* Orange glow */
        
        .food-side::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(255, 107, 0, 0.15);
            border-radius: 50%;
            filter: blur(100px);
            top: -150px;
            left: -150px;
        }
        /* =========================
           LEFT CONTENT
        ========================= */
        
        .food-content {
            position: relative;
            z-index: 5;
            max-width: 550px;
            animation: contentAppear 1.2s ease forwards;
        }
        
        @keyframes contentAppear {
            from {
                opacity: 0;
                transform: translateX(-60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .welcome-text {
            color: var(--orange);
            font-size: 32px;
            font-style: italic;
            font-weight: 500;
            margin-bottom: 5px;
            animation: fadeUp 1s ease;
        }
        
        .food-logo {
            font-size: clamp(48px, 5vw, 76px);
            font-weight: 900;
            letter-spacing: 2px;
            color: white;
            line-height: 1;
        }
        
        .food-logo span {
            color: var(--orange);
        }
        
        .orange-line {
            width: 85px;
            height: 4px;
            background: var(--orange);
            margin: 25px 0;
            border-radius: 10px;
            animation: lineGrow 1.3s ease;
        }
        
        @keyframes lineGrow {
            from {
                width: 0;
            }
            to {
                width: 85px;
            }
        }
        
        .tagline {
            font-size: 27px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
        }
        
        .tagline span {
            color: var(--orange);
        }
        
        .description {
            max-width: 450px;
            color: #dddddd;
            font-size: 17px;
            line-height: 1.7;
        }
        /* =========================
           FLOATING FOOD ICONS
        ========================= */
        
        .food-icon {
            position: absolute;
            font-size: 34px;
            opacity: 0.85;
            z-index: 3;
            filter: drop-shadow( 0 5px 8px rgba(0, 0, 0, 0.5));
            animation: floatIcon 5s ease-in-out infinite;
        }
        
        .food-icon.one {
            top: 14%;
            left: 10%;
        }
        
        .food-icon.two {
            top: 20%;
            right: 8%;
            animation-delay: 1s;
        }
        
        .food-icon.three {
            bottom: 28%;
            left: 8%;
            animation-delay: 2s;
        }
        
        .food-icon.four {
            bottom: 15%;
            right: 12%;
            animation-delay: 3s;
        }
        
        .food-icon.five {
            top: 45%;
            left: 4%;
            font-size: 25px;
            animation-delay: 1.5s;
        }
        
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-22px) rotate(12deg);
            }
        }
        /* Small glowing particles */
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--orange);
            border-radius: 50%;
            opacity: 0.7;
            animation: particleMove 6s linear infinite;
        }
        
        .particle.p1 {
            top: 25%;
            left: 25%;
        }
        
        .particle.p2 {
            top: 65%;
            left: 18%;
            animation-delay: 2s;
        }
        
        .particle.p3 {
            top: 35%;
            right: 20%;
            animation-delay: 3s;
        }
        
        .particle.p4 {
            bottom: 20%;
            right: 25%;
            animation-delay: 1s;
        }
        
        @keyframes particleMove {
            0% {
                transform: translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-30px);
                opacity: 1;
            }
            100% {
                transform: translateY(-60px);
                opacity: 0;
            }
        }
        /* =========================
           RIGHT LOGIN SECTION
        ========================= */
        
        .login-side {
            width: 52%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px;
            position: relative;
            background: radial-gradient( circle at 80% 10%, rgba(255, 107, 0, 0.15), transparent 35%), radial-gradient( circle at 20% 90%, rgba(255, 107, 0, 0.08), transparent 35%), #101010;
        }
        /* =========================
           LOGIN CARD
        ========================= */
        
        .login-card {
            width: 500px;
            padding: 42px 45px;
            background: var(--card);
            border: 1.5px solid rgba(255, 107, 0, 0.75);
            border-radius: 25px;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.12), 0 20px 60px rgba(0, 0, 0, 0.65);
            position: relative;
            overflow: hidden;
            animation: cardEnter 1s cubic-bezier(.17, .67, .35, 1.15);
        }
        
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* Card orange light */
        
        .login-card::before {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 107, 0, 0.08);
            border-radius: 50%;
            filter: blur(60px);
            top: -100px;
            right: -70px;
            pointer-events: none;
        }
        /* =========================
           CHEF ICON
        ========================= */
        
        .chef-icon {
            text-align: center;
            font-size: 58px;
            margin-bottom: 8px;
            animation: chefFloat 3s ease-in-out infinite;
        }
        
        @keyframes chefFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        
        .login-title {
            text-align: center;
            font-size: 34px;
            color: white;
            margin-bottom: 7px;
        }
        
        .login-subtitle {
            text-align: center;
            color: #999;
            font-size: 15px;
            margin-bottom: 30px;
        }
        /* =========================
           INPUTS
        ========================= */
        
        .input-box {
            position: relative;
            margin-bottom: 18px;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            z-index: 2;
        }
        
        .input-box input {
            width: 100%;
            height: 56px;
            padding: 0 50px;
            background: #242424;
            border: 1px solid #555;
            border-radius: 11px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-box input::placeholder {
            color: #888;
        }
        
        .input-box input:focus {
            outline: none;
            border-color: var(--orange);
            background: #292929;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.08), 0 0 15px rgba(255, 107, 0, 0.15);
        }
        /* Password eye */
        
        .show-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 19px;
            opacity: 0.8;
            transition: 0.2s;
        }
        
        .show-password:hover {
            opacity: 1;
        }
        /* =========================
           OPTIONS
        ========================= */
        
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 2px 24px;
            font-size: 14px;
            color: #ccc;
        }
        
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .remember input {
            width: 15px;
            height: 15px;
            accent-color: var(--orange);
            cursor: pointer;
        }
        
        .forgot {
            color: var(--orange);
            text-decoration: none;
            transition: 0.3s;
        }
        
        .forgot:hover {
            color: var(--orange-light);
            text-decoration: underline;
        }
        /* =========================
           LOGIN BUTTON
        ========================= */
        
        .login-btn {
            width: 100%;
            height: 57px;
            border: none;
            border-radius: 11px;
            background: linear-gradient( 135deg, #ff6200, #ff9800);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 7px 20px rgba(255, 107, 0, 0.25);
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 107, 0, 0.4);
        }
        
        .login-btn:active {
            transform: scale(0.98);
        }
        
        .login-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-20deg);
            transition: 0.7s;
        }
        
        .login-btn:hover::after {
            left: 130%;
        }
        /* =========================
           MESSAGE
        ========================= */
        
        #message {
            text-align: center;
            min-height: 20px;
            margin-top: 15px;
            font-size: 14px;
        }
        /* =========================
           DIVIDER
        ========================= */
        
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 28px 0 20px;
            color: #888;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #444;
            flex: 1;
        }
        /* =========================
           SOCIAL BUTTONS
        ========================= */
        
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #292929;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 21px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-5px);
            border-color: var(--orange);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.2);
        }
        
        .google {
            color: #ffffff;
        }
        
        .facebook {
            color: #4d8cff;
        }
        
        .email {
            color: #ffffff;
        }
        /* =========================
           REGISTER
        ========================= */
        
        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 15px;
        }
        
        .register-text a {
            color: var(--orange);
            text-decoration: none;
            font-weight: bold;
            margin-left: 4px;
        }
        
        .register-text a:hover {
            text-decoration: underline;
        }
        /* =========================
           BACK BUTTON
        ========================= */
        
        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        
        .back-home:hover {
            color: var(--orange);
        }
        /* =========================
           RESPONSIVE
        ========================= */
        
        @media (max-width: 1000px) {
            body {
                overflow-y: auto;
            }
            .login-page {
                flex-direction: column;
            }
            .food-side {
                width: 100%;
                min-height: 48vh;
                padding: 50px;
                align-items: center;
            }
            .login-side {
                width: 100%;
                min-height: 52vh;
                padding: 40px 20px;
            }
            .food-content {
                max-width: 600px;
            }
            .food-logo {
                font-size: 60px;
            }
        }
        
        @media (max-width: 600px) {
            .food-side {
                min-height: 40vh;
                padding: 35px 25px;
            }
            .welcome-text {
                font-size: 25px;
            }
            .food-logo {
                font-size: 43px;
            }
            .tagline {
                font-size: 20px;
            }
            .description {
                font-size: 14px;
            }
            .login-side {
                padding: 25px 15px;
            }
            .login-card {
                width: 100%;
                padding: 32px 22px;
                border-radius: 20px;
            }
            .login-title {
                font-size: 28px;
            }
            .chef-icon {
                font-size: 48px;
            }
            .food-icon {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-page">

        <!-- =================================
         LEFT FOOD SECTION
    ================================== -->

        <section class="food-side">

            <!-- Floating food -->
            <div class="food-icon one">🍕</div>
            <div class="food-icon two">🌶️</div>
            <div class="food-icon three">🍔</div>
            <div class="food-icon four">🍅</div>
            <div class="food-icon five">🍟</div>

            <!-- Floating particles -->
            <div class="particle p1"></div>
            <div class="particle p2"></div>
            <div class="particle p3"></div>
            <div class="particle p4"></div>

            <div class="food-content">

                <div class="welcome-text">
                    Welcome to
                </div>

                <div class="food-logo">
                    FOOD<span>HOUSE</span>
                </div>

                <div class="orange-line"></div>

                <div class="tagline">
                    Good Food <span>|</span> Good Mood
                </div>

                <p class="description">
                    Login to your account and explore delicious food, exciting offers and a delightful dining experience.
                </p>

            </div>

        </section>


        <!-- =================================
         RIGHT LOGIN SECTION
    ================================== -->

        <section class="login-side">

            <div class="login-card">

                <!-- Chef -->
                <div class="chef-icon">
                    👨‍🍳
                </div>

                <h1 class="login-title">
                    Welcome Back!
                </h1>

                <p class="login-subtitle">
                    Login to continue
                </p>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <!-- Username -->

                    <div class="input-box">

                        <span class="input-icon">
                        👤
                    </span>

                        <input type="text" id="username" placeholder="Username" autocomplete="username" required>

                    </div>


                    <!-- Password -->

                    <div class="input-box">

                        <span class="input-icon">
                        🔒
                    </span>

                        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>

                        <span class="show-password" id="showPassword" title="Show password">
                        👁️
                    </span>

                    </div>


                    <!-- Options -->

                    <div class="options">

                        <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                        <a href="#" class="forgot" onclick="return false;">
                        Forgot Password?
                    </a>

                    </div>


                    <!-- Login button -->

                    <button type="submit" class="login-btn" id="loginButton">
                    Login ➜
                </button>

                </form>


                <!-- Message -->

                <p id="message"></p>


                <!-- Divider -->

                <div class="divider">
                    or continue with
                </div>


                <!-- Social buttons -->

                <div class="social-buttons">

                    <div class="social-btn google" title="Google login">
                        G
                    </div>

                    <div class="social-btn facebook" title="Facebook login">
                        f
                    </div>

                    <div class="social-btn email" title="Email login">
                        ✉
                    </div>

                </div>


                <!-- Register -->

                <div class="register-text">

                    Don't have an account?

                    <a href="register.html">
                    Register
                </a>

                </div>


                <!-- Back -->

                <a href="foodhouse.html" class="back-home">
                ← Back to Food House
            </a>

            </div>

        </section>

    </div>


    <script>
        /* =================================
                           SHOW / HIDE PASSWORD
                        ================================= */

        const passwordInput =
            document.getElementById("password");

        const showPassword =
            document.getElementById("showPassword");

        showPassword.addEventListener("click", function() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                showPassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";

                showPassword.textContent = "👁️";

            }

        });


        /* =================================
           LOGIN
        ================================= */

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;


                message.style.color = "#aaa";

                message.textContent =
                    "Checking your account... 🍽️";


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "https://foodhouse1.onrender.com/api/auth/login", {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify({
                                    username: username,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (response.ok) {

                        message.style.color =
                            "#00d26a";

                        message.textContent =
                            "Login successful! Welcome to FOODHOUSE 🍴";


                        /* Save token */

                        if (data.token) {

                            localStorage.setItem(
                                "token",
                                data.token
                            );

                        }


                        /* Redirect */

                        setTimeout(function() {

                            window.location.href =
                                "foodhouse.html";

                        }, 1000);


                    } else {

                        message.style.color =
                            "#ff4d4d";

                        message.textContent =
                            data.message ||
                            "Invalid username or password.";

                        loginButton.disabled = false;

                        loginButton.textContent =
                            "Login ➜";

                    }

                } catch (error) {

                    console.error(error);

                    message.style.color =
                        "#ff4d4d";

                    message.textContent =
                        "Unable to connect to FOODHOUSE server.";

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login ➜";

                }

            }
        );
    </script>

</body>

</html>
