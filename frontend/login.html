<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODHOUSE - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        
        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #f97316;
        }
        
        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .login-button:hover {
            background: #ea580c;
        }
        
        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            text-align: center;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .register-link a {
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                🍽️ FOODHOUSE
            </div>

            <div class="subtitle">
                Login to your account
            </div>


            <div id="message" class="message"></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Enter your password" required>

                </div>


                <button type="submit" class="login-button" id="loginButton">
                    Login
                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <a href="foodhouse.html" class="back-home">
                ← Back to FOODHOUSE
            </a>

        </div>

    </div>


    <script>
        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        function showMessage(text, success) {

            message.textContent = text;

            message.style.display = "block";

            message.style.background =
                success ? "#dcfce7" : "#fee2e2";

            message.style.color =
                success ? "#166534" : "#991b1b";
        }


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                    .getElementById("email")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("password")
                    .value;


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/auth/login", {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok ||
                        !data.success) {

                        throw new Error(
                            data.message ||
                            "Login failed"
                        );

                    }


                    // Save authentication
                    localStorage.setItem(
                        "foodhouseToken",
                        data.token
                    );


                    localStorage.setItem(
                        "foodhouseUser",
                        JSON.stringify(data.user)
                    );


                    showMessage(
                        "Login successful!",
                        true
                    );


                    setTimeout(function() {

                        window.location.href =
                            "foodhouse.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to login",
                        false
                    );


                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );
    </script>

</body>

</html>
